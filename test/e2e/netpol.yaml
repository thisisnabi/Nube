# Service routing (iptables DNAT, source IP preserved), network policy and
# DaemonSet checks.
kind: DaemonSet
metadata: { name: logger }
spec:
  template:
    image: busybox:1.36
    command: ["sh", "-c", "while true; do echo \"logger on $NUBE_NODE_NAME\"; sleep 5; done"]
---
# Answers every TCP connection with the caller's address.
kind: Deployment
metadata: { name: whoami }
spec:
  replicas: 2
  template:
    labels: { app: whoami }
    image: alpine/socat
    imagePullPolicy: IfNotPresent
    args: ["TCP-LISTEN:8080,fork,reuseaddr", "SYSTEM:echo $SOCAT_PEERADDR"]
    ports: [{ containerPort: 8080 }]
---
kind: Service
metadata: { name: whoami }
spec:
  internal: true
  ports: [{ port: 8080 }]
---
kind: Deployment
metadata: { name: frontend }
spec:
  replicas: 2
  template:
    labels: { role: frontend }
    image: busybox:1.36
    command: ["sleep", "100000"]
---
kind: Deployment
metadata: { name: batch }
spec:
  replicas: 2
  template:
    labels: { role: batch }
    image: busybox:1.36
    command: ["sleep", "100000"]
