# A pod with an init container and two containers sharing localhost and a
# size-limited scratch volume (emptyDir).
kind: Deployment
metadata:
  name: blog
spec:
  replicas: 2
  template:
    emptyDirs:
      - { name: html, sizeLimit: 64Mi }        # or medium: Memory for tmpfs
    initContainers:                              # run in order, must exit 0
      - name: setup
        image: busybox:1.36
        command: ["sh", "-c", "echo '<h1>hello from the init container</h1>' > /html/index.html"]
        volumes: [{ emptyDir: html, containerPath: /html }]
    containers:
      - name: web
        image: nginx:alpine
        ports: [{ containerPort: 80 }]
        resources: { cpu: 100m, memory: 64Mi }
        volumes: [{ emptyDir: html, containerPath: /usr/share/nginx/html }]
        healthCheck: { httpGet: { path: /, port: 80 } }
      - name: checker                            # same network: reaches nginx on localhost
        image: busybox:1.36
        command: ["sh", "-c", "while true; do wget -qO- http://localhost/ >/dev/null && echo ok; sleep 10; done"]
---
kind: Service
metadata:
  name: blog
spec:
  ports: [{ port: 8081, targetPort: 80 }]
# Logs of one container:  nube logs blog-xxxxx -c checker
