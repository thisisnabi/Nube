# A one-off Job and a nightly CronJob.
kind: Job
metadata:
  name: migrate
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3                 # give up after 4 failed pods
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600   # remove the finished job after an hour
  template:
    image: busybox:1.36
    command: ["sh", "-c", "echo migrating; sleep 5; echo done"]
---
kind: CronJob
metadata:
  name: backup
spec:
  schedule: "0 3 * * *"           # 03:00 every day (also: @hourly, */15 * * * *, @every 30m)
  timeZone: Asia/Tehran
  concurrencyPolicy: Forbid       # skip a run while the previous one is still going
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    backoffLimit: 2
    template:
      image: busybox:1.36
      command: ["sh", "-c", "date; echo backing up"]
# Run it now:  nube trigger cronjob backup
