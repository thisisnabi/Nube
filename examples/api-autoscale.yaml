# An app that scales between 2 and 8 replicas to keep CPU near 70% of its request,
# and reads settings from a ConfigMap. Uncomment nodeSelector to pin it to labelled nodes.
kind: ConfigMap
metadata:
  name: api-config
  namespace: prod                 # envFrom reads from the pod's own namespace
data:
  LOG_LEVEL: info
  CACHE_URL: redis://redis.default:6379   # "<service>.<namespace>" across namespaces
---
kind: Deployment
metadata:
  name: api
  namespace: prod
spec:
  replicas: 2
  autoscale: { min: 2, max: 8, targetCPUPercent: 70 }
  strategy: { maxSurge: 1, maxUnavailable: 0 }       # zero-downtime rollouts
  # nodeSelector: { tier: app }                      # nube label node NAME tier=app
  template:
    image: nginx:alpine
    envFrom:
      - configMap: api-config
    ports:
      - containerPort: 80
    resources: { cpu: 250m, memory: 128Mi }
    healthCheck:
      httpGet: { path: /, port: 80 }
      periodSeconds: 5
      failureThreshold: 3
---
kind: Service
metadata:
  name: api
  namespace: prod
spec:
  selector: { app: api }
  ports:
    - port: 9000
      targetPort: 80
